# Nightly JMH benchmark run on GitHub Actions.
#
# Prints raw JMH text output for each suite into the Actions log. The run is
# triggered nightly (02:00 UTC) and can also be kicked off manually via
# workflow_dispatch.
#
# Results intentionally do NOT fail the build on regression — JMH
# numbers on shared CI runners are noisy. Use the job log to spot trends
# over time; pin thresholds once you have a stable baseline.
name: Benchmarks

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

env:
  JAVA_OPTS: ""
  SBT_OPTS: -Dsbt.supershell=false

jobs:
  jmh:
    name: jmh
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install sbt
        run: |
          if ! command -v sbt >/dev/null 2>&1; then
            curl -fL https://github.com/coursier/launchers/raw/master/cs-x86_64-pc-linux.gz | gzip -d > /usr/local/bin/cs
            chmod +x /usr/local/bin/cs
            cs install sbt
          fi
          echo "$HOME/.local/share/coursier/bin" >> "$GITHUB_PATH"

      - name: Purge stale JMH classes
        run: rm -rf target/out/jvm/scala-3.8.4/zio-pdf-bench/classes/zio/pdf/scan/bench/jmh_generated

      - name: ScannerLiftBench
        run: >
          sbt -batch
          "bench/Jmh/run -i 5 -wi 3 -f 1 -t 1 -bm avgt -tu us .*ScannerLiftBench.*"
          2>&1 | tee bench-scanner-lift.txt

      - name: StreamDecoderBench
        run: >
          sbt -batch
          "bench/Jmh/run -i 5 -wi 3 -f 1 -t 1 -bm avgt -tu ms .*StreamDecoderBench.*"
          2>&1 | tee bench-stream-decoder.txt

      - name: RingBufferBench
        run: >
          sbt -batch
          "bench/Jmh/run -i 5 -wi 3 -f 1 -t 1 -bm avgt -tu us .*RingBufferBench.*"
          2>&1 | tee bench-ringbuffer.txt

      - name: ScodecDeriverBench
        run: >
          sbt -batch
          "bench/Jmh/run -i 5 -wi 3 -f 1 -t 1 -bm avgt -tu ms .*ScodecDeriverBench.*"
          2>&1 | tee bench-deriver.txt

      - name: FastCdcBench
        run: >
          sbt -batch
          "bench/Jmh/run -i 5 -wi 3 -f 1 -t 1 -bm thrpt -tu s .*FastCdcBench.*"
          2>&1 | tee bench-cdc.txt

      - name: PdfHyperdriveBench
        run: >
          sbt -batch
          "bench/Jmh/run -i 5 -wi 3 -f 1 -t 1 -bm avgt -tu us .*PdfHyperdriveBench.*"
          2>&1 | tee bench-hyperdrive.txt

      - name: PdfEvidenceBench
        run: >
          sbt -batch
          "bench/Jmh/run -prof gc -i 5 -wi 3 -f 1 -t 1 -bm avgt -tu us .*(PublicPdfCorpusBench|EvidenceBench).*"
          2>&1 | tee bench-evidence.txt

      - name: HeadToHeadBench (ZIO vs fs2 streaming)
        run: >
          sbt -batch
          "benchFs2/Jmh/run -i 5 -wi 3 -f 1 -t 1 -bm avgt -tu ms .*HeadToHeadBench.*"
          2>&1 | tee bench-head-to-head.txt

      - name: PdfDecodeHeadToHeadBench
        run: >
          sbt -batch
          "benchFs2/Jmh/run -i 5 -wi 3 -f 1 -t 1 -bm avgt -tu us .*PdfDecodeHeadToHead.*"
          2>&1 | tee bench-pdf-head-to-head.txt

      - name: Upload bench results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-results-${{ github.run_id }}
          path: bench-*.txt
          retention-days: 90
          if-no-files-found: warn
