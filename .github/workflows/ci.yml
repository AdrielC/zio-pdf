# Continuous integration on GitHub Actions.
name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JAVA_OPTS: ""
  SBT_OPTS: -Dsbt.supershell=false

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install independent PDF validators
        run: sudo apt-get update && sudo apt-get install -y qpdf poppler-utils

      - name: Install sbt
        run: |
          if ! command -v sbt >/dev/null 2>&1; then
            curl -fL https://github.com/coursier/launchers/raw/master/cs-x86_64-pc-linux.gz | gzip -d > /usr/local/bin/cs
            chmod +x /usr/local/bin/cs
            cs install sbt
          fi
          echo "$HOME/.local/share/coursier/bin" >> "$GITHUB_PATH"

      - name: Run verified test suites
        run: |
          npm ci
          sbt -batch ';kyoPdf/checkScanCaptures;kyoPdf/testFull;kyoPdfZio/testFull;kyoPdfFs2/testFull;kyoPdfPipeline/testFull;paperMachine/testFull;root/testFull;scalaJs/testFull;bench/testFull'

      - name: Package API and documentation
        run: sbt -batch ';kyoPdf/package;kyoPdfZio/package;kyoPdfFs2/package;kyoPdfPipeline/package;root/package;root/packageDoc;scalaJs/package'

      - name: Build Scala.js browser demo
        run: |
          npm --prefix examples-js/frontend ci
          npm --prefix examples-js/frontend run build

      - name: Smoke examples
        run: sbt -batch examples/run

      - name: Validate generated PDF independently
        run: bash scripts/verify-generated-pdf.sh

      - name: Compile bench subprojects
        run: sbt -batch "bench/Jmh/compile;benchFs2/Jmh/compile"

      - name: Audit release artifact
        run: bash scripts/audit-published-artifact.sh

      - name: Prove external consumption
        run: |
          bash scripts/verify-external-consumer.sh
          bash scripts/verify-policy-consumer.sh

  native:
    name: Scala Native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Native build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libexpat1-dev zlib1g-dev qpdf poppler-utils
      - name: Install sbt
        run: |
          if ! command -v sbt >/dev/null 2>&1; then
            curl -fL https://github.com/coursier/launchers/raw/master/cs-x86_64-pc-linux.gz | gzip -d > /usr/local/bin/cs
            chmod +x /usr/local/bin/cs
            cs install sbt
          fi
          echo "$HOME/.local/share/coursier/bin" >> "$GITHUB_PATH"
      - name: Test and consume the Scala Native package
        run: |
          python3 scripts/verify-native-provenance.py
          sbt --server -J-Xms128m -J-Xmx3g -J-XX:ActiveProcessorCount=4 -Dsbt.server.autostart=false -batch ";kyoPdfNative/testFull;kyoPdfFs2Native/testFull;blocksSchemaNative/testFull;kyoPdfPipelineNative/testFull"
          bash scripts/verify-native-consumer.sh
          bash scripts/verify-native-policy-consumer.sh

  semantic-tools:
    name: Semantic tools (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        platform: [jvm, native]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install renderer test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libexpat1-dev zlib1g-dev qpdf poppler-utils tesseract-ocr tesseract-ocr-eng python3-venv
          python3 -m venv "$RUNNER_TEMP/semantic-python"
          "$RUNNER_TEMP/semantic-python/bin/pip" install -r scripts/semantic-requirements.txt
          echo "KYO_PDF_SEMANTIC_PYTHON=$RUNNER_TEMP/semantic-python/bin/python" >> "$GITHUB_ENV"
      - name: Install sbt
        run: |
          if ! command -v sbt >/dev/null 2>&1; then
            curl -fL https://github.com/coursier/launchers/raw/master/cs-x86_64-pc-linux.gz | gzip -d > /usr/local/bin/cs
            chmod +x /usr/local/bin/cs
            cs install sbt
          fi
          echo "$HOME/.local/share/coursier/bin" >> "$GITHUB_PATH"
      - name: Run actual semantic graph and independent artifact checks
        run: bash scripts/verify-semantic-tools.sh "${{ matrix.platform }}"

  gotenberg-tool:
    name: Gotenberg and policy tools
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      gotenberg:
        # Gotenberg 8.36.0 multi-platform image.
        image: gotenberg/gotenberg@sha256:87c16b9f364279d321bc9772d31fa58aa6abe036423c270698bd636c3a8e9466
        ports:
          - 3000/tcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y qpdf poppler-utils
      - name: Install sbt
        run: |
          if ! command -v sbt >/dev/null 2>&1; then
            curl -fL https://github.com/coursier/launchers/raw/master/cs-x86_64-pc-linux.gz | gzip -d > /usr/local/bin/cs
            chmod +x /usr/local/bin/cs
            cs install sbt
          fi
          echo "$HOME/.local/share/coursier/bin" >> "$GITHUB_PATH"
      - name: Verify archival packets and policies through MCP
        env:
          KYO_PDF_GOTENBERG_PORT: ${{ job.services.gotenberg.ports['3000'] }}
        run: |
          repositories="$RUNNER_TEMP/gotenberg-sbt-repositories"
          printf '%s\n' '[repositories]' 'local' 'central: https://repo.maven.apache.org/maven2' > "$repositories"
          JAVA_TOOL_OPTIONS="-Dsbt.repository.config=$repositories -Dsbt.override.build.repos=true" \
            bash scripts/verify-gotenberg-tool.sh
