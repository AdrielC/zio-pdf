# Continuous integration — Gitea Actions (Tybera) + GitHub Actions compatible.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Required for Coursier on Tybera runners (see Tybera/quasar).
  HOME: /root

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Coursier cache
        uses: coursier/cache-action@v6

      - name: Run tests
        run: |
          export HOME="${HOME:-/root}"
          sbt -batch -Dsbt.supershell=false test

      - name: Compile bench subprojects
        run: |
          export HOME="${HOME:-/root}"
          sbt -batch -Dsbt.supershell=false "bench/Jmh/compile" "benchFs2/Jmh/compile"
