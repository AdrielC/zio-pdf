# Continuous integration on GitHub Actions.
name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JAVA_OPTS: ""
  SBT_OPTS: -Dsbt.supershell=false

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install independent PDF validators
        run: sudo apt-get update && sudo apt-get install -y qpdf poppler-utils

      - name: Install sbt
        run: |
          if ! command -v sbt >/dev/null 2>&1; then
            curl -fL https://github.com/coursier/launchers/raw/master/cs-x86_64-pc-linux.gz | gzip -d > /usr/local/bin/cs
            chmod +x /usr/local/bin/cs
            cs install sbt
          fi
          echo "$HOME/.local/share/coursier/bin" >> "$GITHUB_PATH"

      - name: Run verified test suites
        run: |
          npm ci
          sbt -batch ';root/test;scalaJs/test;bench/test'

      - name: Package API and documentation
        run: sbt -batch ';root/package;root/packageDoc;scalaJs/package'

      - name: Build Scala.js browser demo
        run: |
          npm --prefix examples-js/frontend ci
          npm --prefix examples-js/frontend run build

      - name: Smoke examples
        run: sbt -batch examples/run

      - name: Validate generated PDF independently
        run: bash scripts/verify-generated-pdf.sh

      - name: Compile bench subprojects
        run: sbt -batch "bench/Jmh/compile;benchFs2/Jmh/compile"

      - name: Audit release artifact
        run: bash scripts/audit-published-artifact.sh

      - name: Prove external consumption
        run: bash scripts/verify-external-consumer.sh
