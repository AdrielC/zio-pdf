# Continuous integration — Gitea Actions (internal) + GitHub Actions compatible.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SBT_OPTS: -Dsbt.supershell=false

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Coursier cache
        uses: coursier/cache-action@v6

      - name: Install sbt
        run: |
          # internal Gitea runners need HOME=/root; GitHub Actions must not override HOME.
          if [[ "${{ github.server_url }}" != "https://github.com" ]]; then
            export HOME=/root
          fi
          if ! command -v sbt >/dev/null 2>&1; then
            curl -fL https://github.com/coursier/launchers/raw/master/cs-x86_64-pc-linux.gz | gzip -d > /usr/local/bin/cs
            chmod +x /usr/local/bin/cs
            cs install sbt
          fi
          echo "$HOME/.local/share/coursier/bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: sbt -batch test

      - name: Smoke examples
        run: sbt -batch examples/run

      - name: Compile bench subprojects
        run: sbt -batch "bench/Jmh/compile" "benchFs2/Jmh/compile"
