name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install independent PDF validators
        run: sudo apt-get update && sudo apt-get install -y qpdf poppler-utils
      - uses: coursier/cache-action@95e5b1029b6b86e7bac033ee44a0697d8a527d2d # v8.1.1
      - name: Install sbt
        run: |
          if ! command -v sbt >/dev/null 2>&1; then
            curl -fL https://github.com/coursier/launchers/raw/master/cs-x86_64-pc-linux.gz | gzip -d > /usr/local/bin/cs
            chmod +x /usr/local/bin/cs
            /usr/local/bin/cs install sbt
          fi
          echo "$HOME/.local/share/coursier/bin" >> "$GITHUB_PATH"
      - name: Test the complete build
        run: |
          npm ci
          sbt -batch ';clean;root/test;scanKyo/test;scalaJs/test;bench/test;examples/run'
          npm --prefix examples-js/frontend ci
          npm --prefix examples-js/frontend run build
      - name: Audit the public package
        run: bash scripts/audit-published-artifact.sh
      - name: Prove external consumption
        run: bash scripts/verify-external-consumer.sh
      - name: Validate generated PDF independently
        run: bash scripts/verify-generated-pdf.sh

  maven-central:
    needs: validate
    runs-on: ubuntu-latest
    env:
      PGP_SECRET: ${{ secrets.PGP_SECRET }}
      PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
      SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - uses: coursier/cache-action@95e5b1029b6b86e7bac033ee44a0697d8a527d2d # v8.1.1
      - name: Install sbt
        run: |
          if ! command -v sbt >/dev/null 2>&1; then
            curl -fL https://github.com/coursier/launchers/raw/master/cs-x86_64-pc-linux.gz | gzip -d > /usr/local/bin/cs
            chmod +x /usr/local/bin/cs
            /usr/local/bin/cs install sbt
          fi
          echo "$HOME/.local/share/coursier/bin" >> "$GITHUB_PATH"
      - name: Require credentials and publish signed artifacts
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SONATYPE_USERNAME}" ] || [ -z "${SONATYPE_PASSWORD}" ] || [ -z "${PGP_SECRET}" ] || [ -z "${PGP_PASSPHRASE}" ]; then
            echo 'Maven Central and PGP credentials are required for a zio-pdf release.' >&2
            exit 1
          fi
          sbt -batch ci-release
      - name: Verify both artifacts from Maven Central
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 30); do
            jvm="https://repo.maven.apache.org/maven2/io/github/adrielc/zio-pdf_3/${version}/zio-pdf_3-${version}.pom"
            js="https://repo.maven.apache.org/maven2/io/github/adrielc/zio-pdf_sjs1_3/${version}/zio-pdf_sjs1_3-${version}.pom"
            if curl -fsS --retry 2 "${jvm}" >/dev/null && curl -fsS --retry 2 "${js}" >/dev/null; then
              echo "Verified zio-pdf ${version} JVM and Scala.js artifacts on Maven Central."
              exit 0
            fi
            sleep 20
          done
          echo "Maven Central did not expose both zio-pdf ${version} artifacts within 10 minutes." >&2
          exit 1

  github-release:
    needs: maven-central
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release after Maven publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes
