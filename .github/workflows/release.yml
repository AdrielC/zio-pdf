name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require curated release notes
        run: test -s "release-notes/${GITHUB_REF_NAME}.md"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install PDF validators and Native build dependencies
        run: sudo apt-get update && sudo apt-get install -y qpdf poppler-utils clang libexpat1-dev zlib1g-dev
      - uses: coursier/cache-action@95e5b1029b6b86e7bac033ee44a0697d8a527d2d # v8.1.1
      - name: Install sbt
        run: |
          if ! command -v sbt >/dev/null 2>&1; then
            curl -fL https://github.com/coursier/launchers/raw/master/cs-x86_64-pc-linux.gz | gzip -d > /usr/local/bin/cs
            chmod +x /usr/local/bin/cs
            /usr/local/bin/cs install sbt
          fi
          echo "$HOME/.local/share/coursier/bin" >> "$GITHUB_PATH"
      - name: Test the complete build
        run: |
          npm ci
          sbt -batch ';clean;kyoPdf/testFull;kyoPdfZio/testFull;kyoPdfPipeline/testFull;paperMachine/testFull;root/testFull;scalaJs/testFull;bench/testFull;examples/run'
          npm --prefix examples-js/frontend ci
          npm --prefix examples-js/frontend run build
      - name: Audit the public package
        run: bash scripts/audit-published-artifact.sh
      - name: Prove external consumption
        run: |
          bash scripts/verify-external-consumer.sh
          bash scripts/verify-policy-consumer.sh
      - name: Test and consume the Scala Native package
        run: |
          sbt --server -J-Xms256m -J-Xmx2g -Dsbt.server.autostart=false -batch kyoPdfNative/testFull
          bash scripts/verify-native-consumer.sh
      - name: Validate generated PDF independently
        run: bash scripts/verify-generated-pdf.sh

  gotenberg-tool:
    name: Gotenberg and policy tools
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      gotenberg:
        # Gotenberg 8.36.0 multi-platform image.
        image: gotenberg/gotenberg@sha256:87c16b9f364279d321bc9772d31fa58aa6abe036423c270698bd636c3a8e9466
        ports:
          - 3000/tcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y qpdf poppler-utils
      - name: Install sbt
        run: |
          if ! command -v sbt >/dev/null 2>&1; then
            curl -fL https://github.com/coursier/launchers/raw/master/cs-x86_64-pc-linux.gz | gzip -d > /usr/local/bin/cs
            chmod +x /usr/local/bin/cs
            cs install sbt
          fi
          echo "$HOME/.local/share/coursier/bin" >> "$GITHUB_PATH"
      - name: Verify archival packets and policies through MCP
        env:
          KYO_PDF_GOTENBERG_PORT: ${{ job.services.gotenberg.ports['3000'] }}
        run: |
          repositories="$RUNNER_TEMP/gotenberg-sbt-repositories"
          printf '%s\n' '[repositories]' 'local' 'central: https://repo.maven.apache.org/maven2' > "$repositories"
          JAVA_TOOL_OPTIONS="-Dsbt.repository.config=$repositories -Dsbt.override.build.repos=true" \
            bash scripts/verify-gotenberg-tool.sh

  maven-central:
    needs: [validate, gotenberg-tool]
    runs-on: ubuntu-latest
    env:
      PGP_SECRET: ${{ secrets.PGP_SECRET }}
      PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
      SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      CI_RELEASE: ';root/publishSigned;scalaJs/publishSigned;kyoPdf/publishSigned;kyoPdfZio/publishSigned;kyoPdfPipeline/publishSigned;kyoPdfNative/publishSigned'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - uses: coursier/cache-action@95e5b1029b6b86e7bac033ee44a0697d8a527d2d # v8.1.1
      - name: Install sbt
        run: |
          if ! command -v sbt >/dev/null 2>&1; then
            curl -fL https://github.com/coursier/launchers/raw/master/cs-x86_64-pc-linux.gz | gzip -d > /usr/local/bin/cs
            chmod +x /usr/local/bin/cs
            /usr/local/bin/cs install sbt
          fi
          echo "$HOME/.local/share/coursier/bin" >> "$GITHUB_PATH"
      - name: Require credentials and publish signed artifacts
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SONATYPE_USERNAME}" ] || [ -z "${SONATYPE_PASSWORD}" ] || [ -z "${PGP_SECRET}" ] || [ -z "${PGP_PASSPHRASE}" ]; then
            echo 'Maven Central and PGP credentials are required for a zio-pdf release.' >&2
            exit 1
          fi
          sbt -batch ci-release
      - name: Verify all artifacts from Maven Central
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 30); do
            ready=true
            for artifact in zio-pdf_3 zio-pdf_sjs1_3 kyo-pdf_3 kyo-pdf-zio_3 kyo-pdf-pipeline_3 kyo-pdf_native0.5_3; do
              base="https://repo.maven.apache.org/maven2/io/github/adrielc/${artifact}/${version}/${artifact}-${version}"
              for suffix in .pom .jar -sources.jar -javadoc.jar; do
                if ! curl -fsS --retry 2 "${base}${suffix}" >/dev/null; then ready=false; fi
              done
            done
            if [[ "$ready" == true ]]; then
              echo "Verified all six ${version} artifacts on Maven Central."
              exit 0
            fi
            sleep 20
          done
          echo "Maven Central did not expose all ${version} artifacts within 10 minutes." >&2
          exit 1
      - name: Run the Policy API from Maven Central
        run: bash scripts/verify-policy-consumer.sh --central "${GITHUB_REF_NAME#v}"

  github-release:
    needs: maven-central
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create GitHub release after Maven publication
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --notes-file "release-notes/${GITHUB_REF_NAME}.md" \
            "${prerelease[@]}"
